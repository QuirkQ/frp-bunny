# Integration test and example for frp-bunny (server + client mode)
#
# Simulates the full production chain with mTLS and real DNS:
#   browser → DNS → frps (SNI routing) → frpc (mTLS tunnel) → Caddy (TLS termination) → app
#
# Three isolated networks with static IPs:
#   public  172.20.0.0/24 — internet-facing (DNS, frps, test client)
#   tunnel  172.20.1.0/24 — frp control plane (frps ↔ frpc, mTLS)
#   backend 172.20.2.0/24 — client-side LAN (frpc, Caddy, app)
#
# DNS is on public and tunnel both, because frpc resolves its own
# SERVER_ADDR here: the suite starts with that name pointing at a black
# hole and test.sh repoints it at the live frps mid-run, which is what
# proves frpc re-resolves rather than caching the address it booted
# with. See dns/hosts.
#
# Usage:
#   ./run.sh          — generate certs, build, test
#   ./run.sh --no-build  — skip image build (use existing frp-bunny:test)

x-frp: &frp
  image: ${FRP_IMAGE:-frp-bunny:test}
  build:
    context: ..

x-dns: &dns
  dns: [172.20.0.2]

# frpc sits on the tunnel and backend networks with no route to the
# public segment — as in production, where the client has no public
# exposure at all. So it resolves against CoreDNS's tunnel-side address
# rather than the public one the visitor uses.
x-dns-tunnel: &dns_tunnel
  dns: [172.20.1.2]

services:
  # ── DNS (resolves *.test.internal → frps) ──────────────────────
  # Mounted as a directory, not two individual files: test.sh rewrites
  # dns/hosts in place and `sed -i` replaces the inode, which a
  # single-file bind mount would hide from CoreDNS.
  dns:
    image: coredns/coredns:latest
    command: ["-conf", "/etc/coredns/Corefile"]
    volumes:
      - ./dns:/etc/coredns:ro
    networks:
      public:
        ipv4_address: 172.20.0.2
      tunnel:
        ipv4_address: 172.20.1.2

  # ── frps (server) ──────────────────────────────────────────────
  server:
    <<: *frp
    environment:
      FRP_TOKEN: test-token-do-not-use-in-production
      TLS_CERT_FILE: /certs/server.crt
      TLS_KEY_FILE: /certs/server.key
      TLS_CA_FILE: /certs/ca.crt
    volumes:
      - certs:/certs:ro
    networks:
      public:
        ipv4_address: 172.20.0.10
      tunnel:
        ipv4_address: 172.20.1.10

  # ── frpc (client) ──────────────────────────────────────────────
  # SERVER_ADDR is a name, not an address, so the suite exercises the
  # same shape production uses — and so test.sh can move the name. frpc
  # passes this string to the dialer on every login attempt (frp's
  # client/connector.go), so a repoint is picked up on the next retry
  # with no restart and no config change.
  client:
    <<: [*frp, *dns_tunnel]
    depends_on:
      server:
        condition: service_healthy
    environment:
      FRP_MODE: client
      FRP_TOKEN: test-token-do-not-use-in-production
      SERVER_ADDR: frps.test.internal
      PROXY_PROTOCOL_VERSION: v2
      TLS_CERT_FILE: /certs/client.crt
      TLS_KEY_FILE: /certs/client.key
      TLS_CA_FILE: /certs/ca.crt
      TLS_SERVER_NAME: frps
    volumes:
      - certs:/certs:ro
      - ./proxies.toml:/etc/frp/conf.d/proxies.toml:ro
    networks:
      tunnel:
        ipv4_address: 172.20.1.20
      backend:
        ipv4_address: 172.20.2.20

  # ── Caddy (TLS termination + reverse proxy) ────────────────────
  # Uses internal CA for self-signed certs in this test environment.
  # In production, remove "tls internal" and Caddy uses Let's Encrypt.
  caddy:
    image: caddy:2-alpine
    <<: *dns
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      backend:
        ipv4_address: 172.20.2.30

  # ── Backend app ─────────────────────────────────────────────────
  app:
    image: nginx:alpine
    networks:
      backend:
        ipv4_address: 172.20.2.40

  # ── Integration test runner ─────────────────────────────────────
  # Waits on service_started, not service_healthy: the client cannot
  # become healthy until this runner repoints frps.test.internal at the
  # live server, so gating on health here would deadlock the suite.
  test:
    image: alpine:3.24
    <<: *dns
    depends_on:
      client:
        condition: service_started
      dns:
        condition: service_started
    entrypoint: ["sh", "/test.sh"]
    volumes:
      - ./test.sh:/test.sh:ro
      # Read-write, and the directory rather than the file, so the
      # runner can rewrite the zone and CoreDNS picks it up.
      - ./dns:/dns
    networks:
      public:
        ipv4_address: 172.20.0.100

networks:
  public:
    ipam:
      config:
        - subnet: 172.20.0.0/24
  tunnel:
    ipam:
      config:
        - subnet: 172.20.1.0/24
  backend:
    ipam:
      config:
        - subnet: 172.20.2.0/24

volumes:
  certs:
    name: example_certs
    external: true
  caddy_data:
